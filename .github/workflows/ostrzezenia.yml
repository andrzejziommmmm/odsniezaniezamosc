name: Ostrzeżenia śniegowe (IMGW + MeteoAlarm)

on:
  schedule:
    - cron: '7,37 * * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ostrzezenia
  cancel-in-progress: false

jobs:
  aktualizuj:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Pobierz ostrzeżenia
        run: python3 scripts/ostrzezenia.py

      - name: Zapisz zmiany
        run: |
          git config user.name "ostrzezenia-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/ostrzezenia.json
          if git diff --cached --quiet; then
            echo "Brak zmian w ostrzeżeniach."
          else
            git commit -m "Aktualizacja ostrzeżeń śniegowych"
            git pull --rebase --autostash
            git push
          fi
